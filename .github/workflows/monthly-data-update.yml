name: 施設データの毎月自動更新

on:
  schedule:
    # 毎月1日 9:00 JST (0:00 UTC) に実行
    - cron: "0 0 1 * *"
  workflow_dispatch: {} # 手動実行用（Actionsタブから「Run workflow」で実行可能）

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # 訪問診療のJMAP取得は全国分で数時間かかることがあるため長めに確保
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 依存パッケージをインストール
        run: npm install

      - name: Playwright(ブラウザ本体)をインストール
        run: npx playwright install --with-deps chromium

      - name: 訪問看護ステーション・ケアマネジャー事業所を更新
        run: node scripts/update-kaigo-opendata.js

      - name: 訪問診療（JMAP）を更新
        run: node scripts/update-home-visit-clinic.js

      - name: 変更があるか確認
        id: check
        run: |
          if git diff --quiet -- houkan-st-data.js caremanager-office-data.js home-visit-clinic-data.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 変更内容をコミット・プッシュ
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add houkan-st-data.js caremanager-office-data.js home-visit-clinic-data.js
          git commit -m "施設データを自動更新（$(date +'%Y-%m-%d')実行）"
          git push
